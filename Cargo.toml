[package]
name        = "timstof-rerun"
version     = "0.1.0"
edition     = "2021"
description = "timsTOF raw data viewer: rustdf (rustims) -> Rerun, no SDK required"
license     = "MIT"
readme      = "README.md"
repository  = "https://github.com/animesh/timstof-rerun"

[[bin]]
name = "timstof-rerun"
path = "src/main.rs"

[dependencies]
rustdf     = "0.4"
# Match installed Rerun Viewer version (0.27.x).
# Viewer and SDK must match - wire protocol is not forward-compatible.
rerun      = { version = "0.33", features = ["sdk"] }
rusqlite   = { version = "0.32", features = ["bundled"] }
clap       = { version = "4",   features = ["derive"] }
rayon      = "1"
log        = "0.4"
env_logger = "0.11"
anyhow     = "1"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
